# foot, matching the alacritty, kitty and ghostty configs next to it.
# Reference: man foot.ini, or https://codeberg.org/dnkl/foot

[main]
# Colors come from the current Omarchy theme, so `omarchy theme set` restyles
# this too. Remove the include to pick your own colors.
include=~/.local/state/omarchy/current/theme/foot.ini
# Widely known terminfo name, so SSH hosts without foot's work too.
term=xterm-256color
# Nerd Font variant, so icons in prompts, Yazi and lazygit render.
font=JetBrainsMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
# 0 = one render thread per CPU core.
workers=0

[scrollback]
lines=10000
# Lines moved per scroll-wheel step in the scrollback.
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
# Ctrl+Insert and Shift+Insert as a second way to copy and paste.
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
# Free Shift+Insert from pasting the primary (middle-click) selection.
primary-paste=none

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
