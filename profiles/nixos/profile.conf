# Groups of alternative apps. "group.X = a b c" defines one, "X = a" picks it;
# only the picked app is deployed or synced, the rest stay in this folder.
# "all" uses every one. Add your own group, e.g.  group.launcher = rofi wofi
group.terminal = alacritty kitty foot ghostty
group.editor = nvim zed
group.wm = hypr mango i3 sway niri bspwm awesome river openbox
group.shell = fish zsh bash nushell elvish xonsh
terminal = kitty
editor = all
wm = mango
shell = fish
