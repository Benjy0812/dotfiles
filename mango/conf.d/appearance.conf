# Window Appearance and Visual Effects

# Cursor Theme
cursor_size=24
# Bibata was not installed; Adwaita is available. Change back after installing Bibata.
cursor_theme=Adwaita

# Window Borders
border_px=2
border_radius=4

# Window Gaps
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=2
gap_outer_vertical=2

# Blur and Transparency
blur=1
blur_layer=1
blur_optimized=0

# Blur parameters
blur_params_radius=8
blur_params_num_passes=3
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1

drag_tile_to_tile=1
