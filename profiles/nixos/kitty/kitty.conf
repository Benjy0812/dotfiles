# Kitty, matching the alacritty, foot and ghostty configs next to it.
# Loads on top of Omarchy's defaults in /etc/xdg/kitty/kitty.conf.
# Reference: https://sw.kovidgoyal.net/kitty/conf/

# Colors come from the current Omarchy theme, so `omarchy theme set` restyles
# this too. Remove the include to pick your own colors.
include ~/.local/state/omarchy/current/theme/kitty.conf

# Nerd Font variant, so icons in prompts, Yazi and lazygit render.
font_family JetBrainsMono Nerd Font
font_size   9.0

window_padding_width 14
# Hyprland draws the borders, so no title bar of its own.
hide_window_decorations yes

# Half-transparent background. The blur behind it comes from the compositor
# (blur in Hyprland's and mango's appearance settings), not from Kitty.
background_opacity 0.5

# Block cursor that doesn't blink; shell integration would change its shape.
cursor_shape          block
cursor_blink_interval 0
shell_integration     no-cursor

# Shift/Ctrl+Insert as a second way to paste and copy.
map shift+insert paste_from_clipboard
map ctrl+insert  copy_to_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter     send_text all \e[13;2u
# Legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u
