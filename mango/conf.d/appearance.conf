# Window Appearance and Visual Effects

# Cursor Theme
# cursor_theme must match a theme installed in ~/.local/share/icons (user) or
# /usr/share/icons (system). These values set the compositor cursor
cursor_size=24
cursor_theme=Bibata-Modern-Classic
env=XCURSOR_THEME, Bibata-Modern-Classic
env=XCURSOR_SIZE, 24

# Window Borders
border_px=2
border_radius=4

# Window Gaps
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=2
gap_outer_vertical=2

# Blur and Transparency
blur=1
blur_layer=1
blur_optimized=0

# Blur parameters
blur_params_radius=8
blur_params_num_passes=3
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1

drag_tile_to_tile=1
