# MangoWM Configuration

# Keyboard Layout
xkb_rules_layout=no

# Mouse
# Acceleration off (0 = none, 1 = flat, 2 = adaptive)
mouse_accel_profile=0
mouse_accel_speed=0.0
trackpad_accel_profile=0
trackpad_accel_speed=0.0
trackpad_natural_scrolling=1

# Startup
# Make fish the shell for everything mango launches (terminals, scripts, etc.)
env=SHELL,/run/current-system/sw/bin/fish
exec_once=~/.config/mango/scripts/autostart.sh

# Display Configuration
# 144Hz monitor on the left, 280Hz monitor on the right.
# Primary Monitor - AOC C27G4ZXU (1920x1080, 280Hz)
monitor_rule=make:AOC,model:C27G4ZXU,width:1920,height:1080,refresh:280.0026,x:1920,y:0,scale:1,primary:1

# Secondary Monitor - AOC 2590G4 (1920x1080, 144Hz)
# XWayland breaks with negative monitor coordinates, so this sits at x:0.
monitor_rule=make:AOC,model:2590G4,width:1920,height:1080,refresh:144.001,x:0,y:0,scale:1

# Laptop Display - eDP-1 (2880x1800, scaled 1.5x -> 1920x1200 logical)
monitor_rule=name:^eDP-1$,width:2880,height:1800,scale:1.5,refresh:120,x:0,y:1080

# Source modular configs
source=~/.config/mango/conf.d/appearance.conf
source=~/.config/mango/conf.d/bind.conf
source=~/.config/mango/conf.d/rules.conf

# noctalia theme (generated later by Noctalia; ignore until it exists)
source_optional=~/.config/mango/noctalia.conf
